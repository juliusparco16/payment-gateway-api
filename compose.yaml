services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_gateway
      POSTGRES_PASSWORD: payment_gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payment_gateway_data:/var/lib/postgresql/data

volumes:
  payment_gateway_data:
